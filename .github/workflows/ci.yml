name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-26"]'

  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      actions: write
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@main
    with:
      mold: true # mold + clang on Linux runners (mise.toml [env])
      package-args: --workspace
      feature-args: ""
      tools: nextest
      doc-tests: false
      setup-command: |
        if [ "${RUNNER_OS}" = Linux ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev pkg-config
        fi
      test-command: cargo nextest run --workspace

  macos:
    if: vars.MACOS_CI_DISABLED != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: macos-runner
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: cbindgen
        run: cargo install cbindgen --locked --force
      - name: just check
        run: just check

  # The slintx-* checks on Linux too, so they still gate a PR while MACOS_CI_DISABLED skips
  # the macOS `just check`.
  slintx:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          # Only what the checks run; the rest of mise.toml builds tools from source.
          install_args: rust just node github:wasm-bindgen/wasm-bindgen
      - name: Licence gate and wasm32 tests
        run: just license-check license-check-test wasm-check

  windows-host:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
      - name: FFI DLL
        run: just windows-dll
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: C# host tests
        # An MSTest.Sdk project is a Microsoft.Testing.Platform executable;
        # `dotnet test` would need the repo-wide MTP opt-in.
        run: dotnet run --project windows/SlintBindings.Tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      - name: WinUI host
        # The demo carries the Windows App SDK runtime (its csproj); the runner has none installed.
        run: dotnet build windows/SlintDemo.WinUI -p:Platform=x64 -p:RuntimeIdentifier=win-x64
        env:
          EnableWindowsTargeting: true
      - name: Weft screen in a WinUI window
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/SlintDemo.WinUI/bin -Recurse -Filter SlintDemo.WinUI.exe | Select-Object -First 1
          ./windows/smoke.ps1 -Exe $exe.FullName -Slint fixtures/weft/login.slint -Out weft-winui.png
      - name: Window capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weft-winui
          path: weft-winui.png
          if-no-files-found: ignore

  gate:
    needs: [rust, macos, slintx, windows-host]
    # always(): report failed or cancelled needs instead of reading a skipped gate as passing.
    if: >-
      always()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pyrlyn/ci/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
          skip-ok: macos
