name: CI

# Called by pipeline.yml (`workflow_call`), as in rtok: push to main and non-draft pull requests
# run it next to pyrlyn/ci's scans; the protect-main required check is `pipeline / gate`.
on:
  workflow_call:
    inputs:
      docs-only:
        description: >-
          The change is documentation only (pipeline.yml's `changes` job, `docs-only` in
          .github/infra.yml). Accepted for parity with rtok; every job still runs.
        type: boolean
        required: false
        default: false
  workflow_dispatch:

# github.workflow names the caller (pipeline); the `ci-` prefix keeps this group apart from
# pipeline.yml's own, so the nested run does not cancel its caller.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Which runner the macOS jobs use: pyrlyn/ci's macos-runner action reads the MACOS_RUNNER
  # variable (unset or `hosted` = the hosted label, `xcode-27-local` = the dedicated Mac).
  macos-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      value: ${{ steps.r.outputs.value }}
    steps:
      - id: r
        uses: pyrlyn/ci/.github/actions/macos-runner@main
        with:
          runner: ${{ vars.MACOS_RUNNER }}
          value: '["macos-26"]'

  rust:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    permissions:
      contents: read
      actions: write
    uses: pyrlyn/ci/.github/workflows/ci-rust.yml@main
    with:
      mold: true # mold + clang on Linux runners (mise.toml [env])
      package-args: --workspace
      feature-args: ""
      tools: nextest
      doc-tests: false
      setup-command: |
        if [ "${RUNNER_OS}" = Linux ]; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev pkg-config
        fi
      test-command: cargo nextest run --workspace

  macos:
    if: vars.MACOS_CI_DISABLED != 'true' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: macos-runner
    # MACOS_RUNNER (pyrlyn/ci macos-runner): unset/hosted = the hosted label, xcode-27-local = the dedicated Mac (fork PRs keep the hosted label)
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'macos-26' }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: cbindgen
        run: cargo install cbindgen --locked --force
      - name: just check
        run: just check
      - name: slintx-convert Xcode tests
        run: just convert-apple

  # The slintx-* checks on Linux too, so they still gate a PR while MACOS_CI_DISABLED skips
  # the macOS `just check`.
  slintx:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Only what the checks run; the rest of mise.toml builds tools from source.
          install_args: rust just node github:wasm-bindgen/wasm-bindgen
      - name: Licence gate and wasm32 tests
        run: just license-check license-check-test wasm-check

  # slintx-convert's ignored Linux tests (Blueprint through blueprint-compiler and GTK 4,
  # HTML through headless Chromium) in the image `just convert-platforms` runs on Colima.
  convert-platforms:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Image
        run: docker build -t slintx-convert-platforms crates/slintx-convert/tests/platform
      - name: Platform tests
        run: docker run --rm --init --ulimit core=0 -v "$PWD:/src" slintx-convert-platforms
      - name: Frames
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slintx-convert-geometry
          path: target/tmp/slintx-convert-geometry
          if-no-files-found: ignore

  windows-host:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      - name: FFI DLL
        run: just windows-dll
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: C# host tests
        # An MSTest.Sdk project is a Microsoft.Testing.Platform executable;
        # `dotnet test` would need the repo-wide MTP opt-in.
        run: dotnet run --project windows/SlintBindings.Tests
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      - name: WinUI host
        # The demo carries the Windows App SDK runtime (its csproj); the runner has none installed.
        run: dotnet build windows/SlintDemo.WinUI -p:Platform=x64 -p:RuntimeIdentifier=win-x64
        env:
          EnableWindowsTargeting: true
      - name: Weft screen in a WinUI window
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/SlintDemo.WinUI/bin -Recurse -Filter SlintDemo.WinUI.exe | Select-Object -First 1
          ./windows/smoke.ps1 -Exe $exe.FullName -Slint fixtures/weft/login.slint -Out weft-winui.png
      - name: Window capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weft-winui
          path: weft-winui.png
          if-no-files-found: ignore

  # Release builds of the shipped command-line tools. Test, example and demo apps
  # (flutter/examples, swift SlintDemo, windows SlintDemo.WinUI) are not built here.
  cli:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    needs: macos-runner
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos]
    # macOS: MACOS_RUNNER (pyrlyn/ci macos-runner), fork PRs keep the hosted label
    runs-on: ${{ matrix.os == 'linux' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(needs.macos-runner.outputs.value)[0] || 'macos-26') }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install_args: rust
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1-dev pkg-config
      - name: slintx-convert
        run: cargo build --locked --release -p slintx-convert --bins
      - name: slint-introspect
        run: cargo build --locked --release --manifest-path flutter/Cargo.toml -p slint-introspect --bins
      - name: Smoke
        run: |
          cargo run --locked --release -q -p slintx-convert -- --help
          dir=$(cargo metadata --format-version 1 --no-deps --manifest-path flutter/Cargo.toml | python3 -c 'import json,sys; print(json.load(sys.stdin)["target_directory"])')
          ls -l "$dir/release/slint-introspect"

  gate:
    needs: [rust, macos, slintx, convert-platforms, windows-host, cli]
    # always(): report failed or cancelled needs instead of reading a skipped gate as passing.
    if: >-
      always()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: pyrlyn/ci/.github/actions/gate@main
        with:
          needs: ${{ toJSON(needs) }}
          skip-ok: macos
