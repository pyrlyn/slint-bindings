[package]
name = "slint-bindings-core"
description = "Host-driven Slint embedding: a custom platform that renders into a caller-owned pixel buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
slint = { workspace = true }
slint-embed = { workspace = true }
i-slint-core = { workspace = true }
slint-interpreter = { workspace = true }
slint-dart-interpreter = { workspace = true }
thiserror = { workspace = true }
accesskit = { workspace = true }

# The GPU path draws with slintx-wgpu; Slint's own GPU renderers must not be in
# the build (`just renderer-check`). Only macOS and Windows present on the GPU,
# so Linux skips the wgpu compile.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
slintx-wgpu = { workspace = true, features = ["slint"] }
pollster = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Feature-unification dependency for image and SVG decoding (see the workspace
# manifest). The host also calls into it for composition and the focus chain;
# the ignore stays so dropping those calls does not look like an unused crate.
ignored = ["i-slint-core"]
