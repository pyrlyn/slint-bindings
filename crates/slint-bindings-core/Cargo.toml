[package]
name = "slint-bindings-core"
description = "Host-driven Slint embedding: a custom platform that renders into a caller-owned pixel buffer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
slint = { workspace = true }
slint-embed = { workspace = true }
i-slint-core = { workspace = true }
slint-interpreter = { workspace = true }
slint-dart-interpreter = { workspace = true }
thiserror = { workspace = true }
accesskit = { workspace = true }

# FemtoVG's wgpu renderer is the public GPU API (Slint has no public Skia
# renderer). It stays off the Linux build: Skia is a multi-gigabyte compile,
# and this feature set is what actually pulls wgpu in.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
slint = { workspace = true, features = ["renderer-femtovg-wgpu", "unstable-wgpu-30"] }
pollster = "0.4.0"

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { workspace = true }

[lints]
workspace = true

[package.metadata.cargo-machete]
# Feature-unification dependency for image and SVG decoding (see the workspace
# manifest). The host also calls into it for composition and the focus chain;
# the ignore stays so dropping those calls does not look like an unused crate.
ignored = ["i-slint-core"]
