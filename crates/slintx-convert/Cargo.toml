[package]
name = "slintx-convert"
description = "Converts .slint files to XML, HTML, Apple Storyboard and GTK Blueprint, keeping structure, layout and bindings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "slint-convert"
path = "src/main.rs"

[dependencies]
slintx-syntax = { path = "../slintx-syntax" }
thiserror = { workspace = true }
# Attribute and text escaping for the XML-shaped outputs (XML, HTML, Storyboard).
quick-xml = "0.42.0"
# The binary only: argument parsing and the one error that bubbles up to main.
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"

[dev-dependencies]
insta = "1.49.0"
trycmd = "1.2.1"
# The geometry tests' reference: each fixture laid out and drawn by Slint
# itself. Dev-only, so the licence gate's normal and build graph stays clean.
# `internal-highlight` maps a source position to the element's rectangle.
slint = { workspace = true }
slint-interpreter = { workspace = true, features = ["internal-highlight"] }
slint-embed = { workspace = true }
pollster = { workspace = true }
rgba-png = { workspace = true }

[lints]
workspace = true
