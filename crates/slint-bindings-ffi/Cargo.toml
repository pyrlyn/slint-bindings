[package]
name = "slint-bindings-ffi"
description = "C ABI over slint-bindings-core for Swift (static library) and WinUI (DLL) hosts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "slint_bindings_ffi"
# rlib only. A staticlib (Swift) or cdylib (WinUI) is a second link of this crate,
# so the justfile asks for that artifact explicitly instead of every `cargo test`.
crate-type = ["rlib"]

[dependencies]
slint-bindings-core = { workspace = true }

[dev-dependencies]
pixel-diff = { workspace = true }

[lints]
workspace = true
