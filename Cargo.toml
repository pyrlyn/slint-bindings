[workspace]
members = ["crates/*"]
# A path dependency under this root would join the workspace and take its
# lints; this one is slint_dart's code, linted and tested in flutter/'s own
# workspace, which it also inherits its dependency versions from.
exclude = ["flutter/packages/slint_build/interpreter"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/listepo/slint-bindings"
publish = false

[workspace.dependencies]
slint-bindings-core = { path = "crates/slint-bindings-core" }
# Shared with flutter/: software platform, Dart FFI events, UI-thread guard.
slint-embed = { path = "flutter/packages/slint/rust/embed" }
# M1 spike renders on the CPU only: no backend, no event loop, no GPU context,
# so the host app keeps its own run loop.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "renderer-software"] }
# Runtime `.slint` (T11): the same exact pin as `slint`. No backend or renderer:
# the core installs the platform and the software renderer itself.
slint-interpreter = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18"] }
# Shared with flutter/: compile, instantiate and the JSON value bridge for
# properties and callbacks (slint_dart's `slint-dart-interpreter`).
slint-dart-interpreter = { path = "flutter/packages/slint_build/interpreter" }
# Feature unification only: without a backend, nothing turns on image and SVG
# decoding, and std-widgets ships its icons as embedded SVG. Internal crate, so
# it moves in lockstep with `slint` (exact pins on all three).
i-slint-core = { version = "=1.18.1", default-features = false, features = ["image-decoders", "svg"] }
thiserror = "2.0.21"
rowan = "0.17.0"
wasm-bindgen-test = "0.3.79"
# Dev-dependency of the FFI e2e: the demo frame is stored as a PNG snapshot.
png = "0.18.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
